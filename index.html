<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-[#F6F6FB] font-sans text-ink antialiased relative">
    
    <header class="m-6 flex items-center justify-between rounded-full bg-white px-8 py-6 shadow-[0_8px_30px_rgba(28,26,46,0.06)] sm:px-20">
      <!-- โลโก้ -->
      <a href="#" class="relative text-3xl font-bold tracking-tight text-gray-900">
        Acme<span class="absolute -right-2 top-1 h-2 w-2 rounded-full bg-[#5E44FF]"></span>
      </a>

      <!-- เมนูสำหรับหน้าจอ Desktop -->
      <nav class="hidden items-center gap-10 text-base font-medium sm:flex">
        <a href="#" class="text-[#5E44FF] underline underline-offset-4">Home</a>
        <a href="#" class="transition hover:text-[#5E44FF]">Features</a>
        <a href="#" class="transition hover:text-[#5E44FF]">Pricing</a>
        <a href="#" class="transition hover:text-[#5E44FF]">Contact</a>
      </nav>

      <!-- ปุ่ม Hamburger สำหรับหน้าจอมือถือ (อัปเดต: สีเทา และเปลี่ยนเป็นสีม่วงตอน Hover) -->
      <button id="menu-btn" class="block text-slate-400 transition hover:text-[#5E44FF] focus:outline-none sm:hidden">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </header>

    <!-- กล่องเมนู Dropdown สำหรับมือถือ -->
    <div id="mobile-menu" class="absolute left-6 right-6 top-[100px] z-50 hidden flex-col items-center gap-8 rounded-3xl bg-white py-10 shadow-[0_8px_30px_rgba(28,26,46,0.1)] sm:hidden">
      <a href="#" class="text-[#5E44FF] underline underline-offset-4 font-medium">Home</a>
      <a href="#" class="font-medium transition hover:text-[#5E44FF]">Features</a>
      <a href="#" class="font-medium transition hover:text-[#5E44FF]">Pricing</a>
      <a href="#" class="font-medium transition hover:text-[#5E44FF]">Contact</a>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <main class="flex flex-col items-center px-6 pb-24 pt-12 text-center sm:pt-32">
      <span class="inline-flex items-center gap-2 rounded-full bg-[#563AFF1A] px-5 py-2 text-sm font-medium text-[#5E44FF]">
        <span>🌈</span>
        Acme Productivity App
      </span>

      <h1 class="mt-12 text-5xl font-extrabold text-gray-900 sm:text-7xl md:text-8xl">
        Boost Your <br class="sm:hidden" />
        <span class="text-[#5E44FF]">Product</span>ivity
      </h1>

      <p class="mt-8 max-w-xl text-lg font-semibold text-gray-700 sm:text-2xl">
        Streamline your workflow with our all-in-one productivity app.
      </p>

      <a href="#" class="mt-12 rounded-2xl px-9 py-4 text-white bg-[#18181B] font-semibold transition hover:bg-[#5E44FF]">
        Start Free Trial
      </a>
    </main>

    <!-- สคริปต์เปิด-ปิดเมนู -->
    <script>
      const menuBtn = document.getElementById('menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');

      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        mobileMenu.classList.toggle('flex');
        
        
        menuBtn.classList.toggle('text-slate-400');
        menuBtn.classList.toggle('text-[#5E44FF]');
      });
    </script>
  </body>
</html>
